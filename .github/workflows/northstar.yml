# North Star kit CI (kit/INSTALL.md "CI is the gate that counts"). High-risk: a human reviews every change.
name: northstar
on:
  pull_request:
    branches: [trial-main]
  push:
    branches: [trial-main]
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: PR tests with coverage
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          export COVERAGE_FILE="$RUNNER_TEMP/out/.coverage"
          python -m coverage run --source=src -m pytest
          python -m coverage xml -o "$RUNNER_TEMP/out/coverage.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/out/coverage.xml
          if-no-files-found: error

  gate:
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: echo gate skipped

  baseline:
    # After each merge: tests with coverage on trial-main; the latest report is the next PR's baseline.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: tests with coverage
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          export COVERAGE_FILE="$RUNNER_TEMP/out/.coverage"
          python -m coverage run --source=src -m pytest
          python -m coverage xml -o "$RUNNER_TEMP/out/coverage.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/out/coverage.xml
          retention-days: 90
          if-no-files-found: error
