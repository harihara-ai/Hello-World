# North Star kit CI (kit/INSTALL.md "CI is the gate that counts"). High-risk: a human reviews every change.
# pull_request_target: GitHub runs this file as it is on the default branch (master), so a PR to trial-main cannot change the jobs (N01).
name: northstar-ci
on:
  pull_request_target:
    branches: [trial-main]
  push:
    branches: [trial-main]
permissions: {}
jobs:
  tests:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: PR tests with coverage
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          export COVERAGE_FILE="$RUNNER_TEMP/out/.coverage"
          python -m coverage run --source=src -m pytest
          python -m coverage xml -o "$RUNNER_TEMP/out/coverage.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/out/coverage.xml
          if-no-files-found: error

  gate:
    # Fresh runner. No PR code runs before gate_check; only red_check (the last gate) runs PR tests.
    if: github.event_name == 'pull_request_target'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: approved kit and test tools from trial-main
        run: |
          set -e
          git worktree add ../approved origin/trial-main
          python -m pip install -r ../approved/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/out
      - name: latest baseline report of trial-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" -w northstar-ci -b trial-main -e push -s success -L 1 \
            --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n coverage-baseline -D "$RUNNER_TEMP/base"
      - name: gate_check
        run: |
          set -e
          BASE=$(git merge-base HEAD origin/trial-main)
          python3 -I ../approved/kit/scripts/gate_check.py auto --repo . --change auto --base "$BASE" \
            --coverage-report "$RUNNER_TEMP/out/coverage.xml" --baseline-report "$RUNNER_TEMP/base/coverage.xml" \
            --test-cmd "python -m pytest -q {tests}"

  baseline:
    # After each merge: tests with coverage on trial-main; the latest report is the next PR's baseline.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: tests with coverage
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          export COVERAGE_FILE="$RUNNER_TEMP/out/.coverage"
          python -m coverage run --source=src -m pytest
          python -m coverage xml -o "$RUNNER_TEMP/out/coverage.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/out/coverage.xml
          retention-days: 90
          if-no-files-found: error
